name: Promote (staging → latest)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (e.g. 1.0.3). Must already exist on npmjs with the staging tag.'
        required: true
        type: string

# Promote is gated by a GitHub Environment called "production" so it requires
# manual approval by an environment reviewer (configured at
# https://github.com/pavalep/react-native-media-player/settings/environments).
# This ensures a real human (you) confirms before staging becomes latest.
#
# OIDC trusted publishing is used (same as release.yml). The trusted publisher
# on npmjs is configured for "npm stage publish", which covers `npm dist-tag`
# mutations under the staging flow. NO NPM_TOKEN secret is required.

permissions:
  contents: write
  id-token: write

jobs:
  promote:
    name: Promote version to latest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://www.npmjs.com/package/@simba-dev/react-native-media-player

    steps:
      # Checkout so the `gh` CLI has a git repo context for tag/release lookups.
      # Uses the default branch (no `ref:`) since this is a workflow_dispatch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify staging version exists
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          PKG="@simba-dev/react-native-media-player"
          # Strip leading 'v' if user typed it
          VERSION="${VERSION#v}"
          echo "Promoting ${PKG}@${VERSION} from staging → latest"
          # Confirm the version is published with the staging tag.
          # stderr is suppressed (2>/dev/null) to drop deprecation warnings
          # that would otherwise corrupt the captured version string.
          STAGING_VER=$(npm view "${PKG}@staging" version --registry https://registry.npmjs.org/ --silent 2>/dev/null || true)
          echo "npm staging tag currently points at: ${STAGING_VER}"
          if [ "$STAGING_VER" != "$VERSION" ]; then
            echo "::error::Version ${VERSION} is not the current @staging (got ${STAGING_VER}). Aborting."
            exit 1
          fi
          # Save resolved version for the next step
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # The dist-tag mutation is metadata, not a publish operation, so it falls
      # outside the trusted publisher's `npm publish` / `npm stage publish`
      # permissions — OIDC can't flip the dist-tag yet.
      # We use a granular access token with bypass-2FA enabled, stored as the
      # `production` environment secret `NPM_TOKEN`. Bypass-2FA is required for
      # CI automation; this capability is being deprecated Jan 2027 — by then
      # we expect npm to extend trusted publishing to dist-tag mutations.
      - name: Promote staging → latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag add "@simba-dev/react-native-media-player@${VERSION}" latest

      - name: Publish the draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION#v}"
          echo "Publishing draft release v${VERSION}"
          # Find the draft release for this tag and publish it
          gh release edit "v${VERSION}" --draft=false || {
            echo "::error::Could not publish draft release v${VERSION}. Publish it manually from https://github.com/pavalep/react-native-media-player/releases"
            exit 1
          }

      - name: Summary
        run: |
          echo "## Promoted to latest :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **npm**: https://www.npmjs.com/package/@simba-dev/react-native-media-player/v/${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **GitHub Release**: https://github.com/pavalep/react-native-media-player/releases/tag/v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
