name: Release (publish to staging)

on:
  push:
    tags:
      - 'v*.*.*'   # matches v1.0.0, v1.2.3, etc.

# OIDC trusted publishing per https://docs.npmjs.com/trusted-publishers
# `id-token: write` is required to mint the OIDC token npm verifies.
# `contents: write` is needed so the GitHub Release step can create releases.
# NOTE: docs example uses `contents: read`, but we need `write` for
# softprops/action-gh-release to create the draft release.
permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  release-staging:
    name: Publish to npm staging + create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog/release-notes

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        env:
          # GitHub-hosted runners default NODE_ENV=production, which makes
          # `npm ci` skip devDependencies (jest, typescript, @types/*, etc).
          # Force development so typecheck + tests have the toolchain they need.
          NODE_ENV: development
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag version     = v${TAG_VERSION}"
          echo "package version = ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Git tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Verify package contents (dry-run)
        run: npm pack --dry-run

      # ---- publish (staging tag only) ------------------------------------
      #
      # Authentication: OIDC trusted publishing.
      # Configured on npmjs.com at:
      #   https://www.npmjs.com/package/@simba-dev/react-native-media-player/settings
      #   → Trusted Publisher → GitHub Actions
      #   → Organization/user: pavalep
      #   → Repository: react-native-media-player
      #   → Workflow filename: release.yml
      #
      # The trusted publisher is configured for "Staged publishing only"
      # (the secure recommended setting), so this step publishes with
      # --tag=staging. The version lands in npm under the "staging" tag.
      # Consumers get it via:
      #   npm install @simba-dev/react-native-media-player@staging
      #
      # To promote staging → latest (production), trigger the
      # .github/workflows/promote.yml workflow from the Actions tab.
      #
      # --provenance attaches a signed attestation linking the package
      # to this exact commit + workflow run, viewable on npmjs.com under
      # the version's "Provenance" tab.
      - name: Publish to npm (staging tag)
        run: npm publish --provenance --access public --tag=staging
        env:
          # Use OIDC token from GitHub Actions (not a long-lived secret).
          # setup-node with registry-url configured the .npmrc to point at
          # registry.npmjs.org and uses NPM_TOKEN if set; we explicitly
          # unset NPM_TOKEN / NODE_AUTH_TOKEN so OIDC fallback fires.
          NPM_TOKEN: ''
          NODE_AUTH_TOKEN: ''

      # ---- github release (draft, awaiting promote) ----------------------
      # Mark the release as a draft so consumers don't see "Latest"
      # pointing at it until promotion. Drafts can be edited/published
      # from the GitHub UI after the promote workflow runs.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
