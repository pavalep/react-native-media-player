name: Release (publish to npm + create GitHub Release)

# Auto-triggers on `v*.*.*` tag push. Also accepts manual
# `workflow_dispatch` for re-runs (e.g. retry a release after a
# transient registry issue).
#
# The `production` GitHub Environment binding on the job is what
# makes NPM_TOKEN readable — the secret is set at environment scope,
# not repo scope. The Debug NPM_TOKEN presence step verifies the
# secret is reachable BEFORE the publish step so a missing token
# fails fast with a clear message instead of an opaque npm 401.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. "1.5.10" or "v1.5.10"). Must match the version in package.json on main.'
        required: true
        type: string
      npm_dist_tag:
        description: 'npm dist-tag to apply (default: latest). Use "next" or "beta" for pre-releases.'
        required: false
        default: 'latest'
        type: string

# Authentication: `secrets.NPM_TOKEN` (Automation scope, configured at
# Settings → Secrets and variables → Actions on this repo). Token must
# have publish rights on the @simba-dev org scope.
#
# `contents: write` is needed so the workflow can create the git tag
# (if missing) and the GitHub Release step can publish the release.
permissions:
  contents: write

concurrency:
  # Single in-flight release at a time (manual runs are rare; safety
  # against accidental double-clicks in the GitHub UI).
  group: release-manual
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm + create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Bind to the `production` GitHub Environment so the job reads
    # environment-scoped secrets (e.g. `production.NPM_TOKEN` set at
    # Settings → Environments → production → Secrets) instead of
    # only repo-scoped secrets. Without this, an environment-only
    # NPM_TOKEN is invisible to the job and the Debug step reports
    # it as unset (even though the secret exists in the UI).
    environment:
      name: production
      url: https://www.npmjs.com/package/@simba-dev/react-native-media-player

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for changelog/release-notes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        env:
          # GitHub-hosted runners default NODE_ENV=production, which makes
          # `npm ci` skip devDependencies (jest, typescript, @types/*, etc).
          # Force development so typecheck + tests have the toolchain they need.
          NODE_ENV: development
        run: npm ci

      - name: Resolve and verify release version
        id: resolve
        # Derives a canonical `version` (no leading `v`) and `tag`
        # (with leading `v`) from one of:
        #   - workflow_dispatch: `inputs.version` (user typed it)
        #   - tag push: `github.ref_name` (the tag itself, e.g. v1.5.11)
        # Fails fast if neither matches package.json. Outputs are
        # consumed by the publish and GitHub Release steps.
        shell: bash
        run: |
          # Prefer the workflow_dispatch input when present (manual
          # runs); otherwise derive from the pushed tag. `github.ref_name`
          # is the tag name on a tag push (e.g. "v1.5.11") and the
          # branch name on a workflow_dispatch (e.g. "main") — but on
          # workflow_dispatch `inputs.version` takes precedence, so
          # the github.ref_name fallback only fires for tag pushes.
          INPUT_VERSION="${{ inputs.version }}"
          if [ -z "$INPUT_VERSION" ]; then
            INPUT_VERSION="${GITHUB_REF_NAME}"
          fi
          # Strip leading 'v' if user typed it (accept both "1.5.10" and "v1.5.10")
          INPUT_VERSION="${INPUT_VERSION#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "input version   = v${INPUT_VERSION}"
          echo "package version = ${PKG_VERSION}"
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Input version v${INPUT_VERSION} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi
          echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${INPUT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # Kotlin compile gate. Added after v1.5.9-v1.5.11 shipped with
      # `codeToNumeric` misplaced inside `JsonUtil` instead of
      # `MpvBridgeModule` — surfaced only at consumer gradle build
      # time, never in the lib's own CI (which only ran `npm test`).
      # This step compiles the lib's Kotlin sources in isolation so a
      # misplacement like that fails the publish before it ships.
      # Uses the JDK + Gradle already on the runner; no extra setup.
      - name: Kotlin compile (lib in isolation)
        run: |
          cd android
          # Compile only this lib module — avoids pulling the consumer
          # app's build context. Uses the gradle wrapper from the
          # lib repo (we're already in it via `cd android`).
          ./gradlew :simba-dev_react-native-media-player:compileDebugKotlin --no-daemon --console=plain 2>&1 | tail -50
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::Kotlin compilation failed. Lib code may have a misplacement or syntax error. See log above."
            exit 1
          fi

      - name: Verify package contents (dry-run)
        run: npm pack --dry-run

      # ---- debug: confirm NPM_TOKEN is reachable -------------------------
      # Diagnostic step. NEVER print the token value — only its length
      # and a fingerprint (head + tail) for cross-checking against the
      # value in `react-native-media-player/.npmrc` without exposing it.
      # Runs BEFORE the publish step so a missing/empty token fails
      # fast with a clear message instead of an opaque npm 401.
      - name: Debug NPM_TOKEN presence
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is unset or empty. Checked: \${{ secrets.NPM_TOKEN }} returned empty. Verify (1) the secret is set at https://github.com/pavalep/react-native-media-player/settings/secrets/actions/NPM_TOKEN (repo scope) OR at https://github.com/pavalep/react-native-media-player/settings/environments/production/secrets/NPM_TOKEN (production env scope, since this workflow's job is bound to the production environment)."
            exit 1
          fi
          TOKEN_LEN=${#NPM_TOKEN}
          TOKEN_HEAD="${NPM_TOKEN:0:4}"
          TOKEN_TAIL="${NPM_TOKEN: -4}"
          echo "NPM_TOKEN is set: length=$TOKEN_LEN head=$TOKEN_HEAD tail=$TOKEN_TAIL"
          # npm automation tokens are 36 chars total (npm_ + 32 hex).
          # Granular tokens are 36 chars too. Legacy auth tokens are
          # ~40 chars and have a different prefix. Anything outside
          # 36-50 chars likely indicates a copy-paste error.
          if [ "$TOKEN_LEN" -lt 36 ] || [ "$TOKEN_LEN" -gt 60 ]; then
            echo "::warning::NPM_TOKEN length $TOKEN_LEN is outside the expected 36-60 range. The token may have been truncated or have stray whitespace."
          fi

      # ---- publish (idempotent) -------------------------------------------
      # Authentication: NPM_TOKEN secret (configured at Settings → Secrets
      # and variables → Actions on this repo). Token must have publish
      # rights on the @simba-dev org scope. Create at
      # https://www.npmjs.com/settings/pavalep/tokens (Automation type,
      # "Publish packages" scope = @simba-dev).
      #
      # Idempotency: if the version is already published to npm (e.g. the
      # author ran `npm publish --access public` manually before
      # triggering this workflow), the publish step is skipped and the
      # workflow continues to create the GitHub Release. This avoids the
      # 409 "version already exists" failure.
      #
      # `--provenance` and `--access public` are intentionally OMITTED —
      # `--provenance` requires OIDC trusted publishing (incompatible
      # with NPM_TOKEN), and `--access public` is already configured in
      # package.json via `publishConfig.access=public`.
      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          # Default to `latest` for tag pushes (no input provided)
          # and `latest` for workflow_dispatch when the input is
          # omitted. Inputs are validated at the workflow_dispatch
          # level; this is just belt-and-braces for the empty case.
          DIST_TAG="${{ inputs.npm_dist_tag }}"
          DIST_TAG="${DIST_TAG:-latest}"
          if npm view "@simba-dev/react-native-media-player@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::Version ${VERSION} is already published to npm. Skipping publish step (likely a manual \`npm publish\` was used). Continuing to GitHub Release."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            npm publish --tag="${DIST_TAG}"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- ensure git tag exists for the GitHub Release step ------------
      # `softprops/action-gh-release@v2` requires the tag to exist in
      # the repo. If the user pushed the tag locally before triggering,
      # we reuse it. If not (e.g. local-only bump + manual trigger), we
      # create + push the tag now from the current HEAD on main.
      - name: Ensure release tag exists
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally. Skipping create."
          else
            echo "Creating tag $TAG at current HEAD on main..."
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # ---- github release (published, not draft) -------------------------
      # Non-draft because we publish directly to the chosen dist-tag
      # (default `latest`; no separate promote step). Consumers see
      # the release as soon as the workflow finishes.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.resolve.outputs.tag }}
          generate_release_notes: true
          draft: false
          # Treat empty `npm_dist_tag` (tag push trigger) as `latest`
          # so the release is published, not marked prerelease.
          prerelease: ${{ inputs.npm_dist_tag != '' && inputs.npm_dist_tag != 'latest' }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}