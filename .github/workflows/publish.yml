name: Publish @simba-dev/react-native-media-player

# ─── Trigger: any push of a `v*.*.*` tag publishes to npmjs. ───
# Local `npm publish` still works for ad-hoc releases — the
# workflow only fires on tags, not on every commit to main.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional npm dist-tag (e.g. next, beta). Defaults to latest.'
        required: false
        default: 'latest'

# Concurrency: cancel any in-flight publish run for the same tag —
# the lock key includes the ref name so two simultaneous tag pushes
# don't both try to `npm publish`.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on the lib repo — same workflow file may be present
    # in the consumer repo but should no-op there.
    if: github.repository == 'pavalep/react-native-media-player'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # CRITICAL: `ref: ${{ github.ref }}` is required so a tag
          # push actually checks out the tagged commit (not main).
          # Without this, `actions/checkout@v4` defaults to the
          # default branch and would publish main's package.json
          # version instead of the tag's - which fails if you tag
          # a version that's ahead of main (e.g. v1.6.0 commit not
          # yet merged back).
          ref: ${{ github.ref }}
          # No `token:` override - the default `${{ github.token }}`
          # works for a public repo and is sufficient to clone.
          # Private repos would need `token: ${{ secrets.GITHUB_TOKEN }}`.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # `registry-url` sets the npm registry endpoint (so `npm
          # publish` doesn't fall back to a private registry or fail
          # with EAI_AGAIN). Auth is handled separately by the
          # `NODE_AUTH_TOKEN` env var in the Publish step below -
          # setup-node's registry-url alone does NOT authenticate.
          # See https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        # Skip native build artifacts (libsimbaplayer_mpv.so etc.)
        # — the npm publish tarball is produced from src/ + ts/ +
        # android/src/main/ + android/build.gradle (NOT from
        # node_modules/.bin / node_modules/@simba-dev/
        # react-native-media-player/android/build/...).

      - name: TypeScript typecheck
        run: npx tsc --noEmit
        # The lib repo uses noEmit-only type checking as a CI gate
        # (the consumer is the one that does real builds). If this
        # fails the publish aborts before any tag goes out.

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Allow workflow_dispatch to override the dist-tag (e.g.
          # `next` for a beta). Default `latest`.
          NPM_PUBLISH_TAG: ${{ github.event.inputs.version || 'latest' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm publish --access public --tag "$NPM_PUBLISH_TAG"
          else
            # Tag-triggered publishes always go to `latest` (or
            # `beta` if the version has a pre-release suffix like
            # 4.0.0-beta.15 — npm auto-tags those correctly).
            npm publish --access public
          fi

      - name: Verify publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Published @simba-dev/react-native-media-player@${VERSION}"
          # Wait up to 90s for the registry to propagate so the
          # `latest` dist-tag points at our version before we
          # return success (otherwise the manager-demo consumer's
          # `npm install --prefer-online` might pick up the old
          # version for a few minutes).
          for i in $(seq 1 18); do
            sleep 5
            LATEST=$(npm view @simba-dev/react-native-media-player dist-tags.latest 2>/dev/null || echo "")
            if [ "$LATEST" = "$VERSION" ]; then
              echo "Registry propagated after ${i} polls ($((i*5))s)"
              exit 0
            fi
          done
          echo "WARN: registry still shows latest=${LATEST} after 90s; manual verify needed"
          exit 0
