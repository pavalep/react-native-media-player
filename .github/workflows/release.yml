name: Release (publish to npm + create GitHub Release)

on:
  push:
    tags:
      - 'v*.*.*'   # matches v1.0.0, v1.2.3, etc.
  workflow_dispatch: # allow manually re-running for an existing tag (idempotent)

# Authentication: NPM_TOKEN secret (Automation scope, configured on the
# GitHub repo at Settings → Secrets and variables → Actions). Token must
# have publish rights on the @simba-dev org scope.
#
# `contents: write` is needed so the GitHub Release step can create releases.
# `id-token: write` is no longer required (we dropped OIDC trusted
# publishing in favour of the NPM_TOKEN path, so the version can go
# straight to `latest` without a separate promote step).
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  release:
    name: Publish to npm latest + create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog/release-notes
          # CRITICAL: `ref: ${{ github.ref }}` is required so a tag
          # push actually checks out the tagged commit (not main).
          # Without this, future version-aware steps would read
          # main's package.json instead of the tag's. The current
          # "Verify tag matches package.json version" step happens
          # to work because it reads GITHUB_REF directly (env var,
          # not file), but `softprops/action-gh-release@v2` and any
          # subsequent file-based step would break on tag pushes.
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        env:
          # GitHub-hosted runners default NODE_ENV=production, which makes
          # `npm ci` skip devDependencies (jest, typescript, @types/*, etc).
          # Force development so typecheck + tests have the toolchain they need.
          NODE_ENV: development
        run: npm ci

      - name: Verify tag matches package.json version
        # Tag-only guard. The bash below derives `TAG_VERSION` by
        # stripping the `refs/tags/v` prefix from `GITHUB_REF`, which
        # only works when the trigger was a tag push. For
        # `workflow_dispatch` runs, `GITHUB_REF = refs/heads/main`
        # (always the default branch), the prefix doesn't match,
        # and `${GITHUB_REF#refs/tags/v}` produces `refs/heads/main`
        # — which never equals the package.json version, so the step
        # would exit 1. Skipping here is correct: a workflow_dispatch
        # re-run is meant to re-validate + re-publish an already-pushed
        # tag, not to discover a tag from GITHUB_REF.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag version     = v${TAG_VERSION}"
          echo "package version = ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Git tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Verify package contents (dry-run)
        run: npm pack --dry-run

      # ---- publish (latest tag, idempotent) ------------------------------
      #
      # Authentication: NPM_TOKEN secret (configured at Settings → Secrets
      # and variables → Actions on this repo). Token must have publish
      # rights on the @simba-dev org scope. Create at
      # https://www.npmjs.com/settings/pavalep/tokens (Automation type,
      # 90-day expiry, "Publish packages" scope = @simba-dev).
      #
      # Idempotency: if the version is already published to npm (e.g. the
      # author ran `npm publish --access public` manually before pushing
      # the tag), the publish step is skipped and the workflow continues
      # to create the GitHub Release. This avoids the 409 "version
      # already exists" failure that previously blocked the GH Release
      # step from running.
      #
      # `--provenance` and `--access public` are intentionally OMITTED —
      # `--provenance` requires OIDC trusted publishing (incompatible
      # with NPM_TOKEN), and `--access public` is already configured in
      # package.json via `publishConfig.access=public`.
      - name: Debug NPM_TOKEN presence
        # Diagnostic — verifies the NPM_TOKEN secret is actually being
        # passed by GitHub Actions into the job env. We never print
        # the token value itself, only its length and a fingerprint
        # of the first 4 + last 4 characters (enough to compare
        # against the value in .npmrc without exposing it). This step
        # runs BEFORE the publish step so a missing/empty token fails
        # fast with a clear message instead of an opaque npm 401.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is unset or empty. Set it at https://github.com/pavalep/react-native-media-player/settings/secrets/actions/NPM_TOKEN"
            exit 1
          fi
          TOKEN_LEN=${#NPM_TOKEN}
          TOKEN_HEAD="${NPM_TOKEN:0:4}"
          TOKEN_TAIL="${NPM_TOKEN: -4}"
          echo "NPM_TOKEN is set: length=$TOKEN_LEN head=$TOKEN_HEAD tail=$TOKEN_TAIL"
          # npm automation tokens are 36 chars total (npm_ + 32 hex).
          # Granular tokens are 36 chars too. Legacy auth tokens are
          # ~40 chars and have a different prefix. Anything outside
          # 36-50 chars likely indicates a copy-paste error.
          if [ "$TOKEN_LEN" -lt 36 ] || [ "$TOKEN_LEN" -gt 60 ]; then
            echo "::warning::NPM_TOKEN length $TOKEN_LEN is outside the expected 36-60 range. The token may have been truncated or have stray whitespace."
          fi

      - name: Publish to npm (latest tag, idempotent)
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@simba-dev/react-native-media-player@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::Version ${PKG_VERSION} is already published to npm. Skipping publish step (likely a manual `npm publish --access public` was used). Continuing to GitHub Release."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            npm publish --tag=latest
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- github release (published, not draft) -------------------------
      # Now non-draft because we publish directly to `latest` (no separate
      # promote step). Consumers see the "Latest" badge pointing at this
      # release as soon as the workflow finishes.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
