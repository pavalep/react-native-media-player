name: Release (publish to staging)

on:
  push:
    tags:
      - 'v*.*.*'   # matches v1.0.0, v1.2.3, etc.

# OIDC trusted publishing per https://docs.npmjs.com/trusted-publishers
# `id-token: write` is required to mint the OIDC token npm verifies.
# `contents: write` is needed so the GitHub Release step can create releases.
# NOTE: docs example uses `contents: read`, but we need `write` for
# softprops/action-gh-release to create the draft release.
permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  release-staging:
    name: Publish to npm staging + create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog/release-notes

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted publishing requires npm >= 11.5 + Node >= 22.14.
          # docs example uses Node 24 (the runner-default).
          node-version: '24'
          # Caching omitted on purpose for release builds (per docs).
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        env:
          # GitHub-hosted runners default NODE_ENV=production, which makes
          # `npm ci` skip devDependencies (jest, typescript, @types/*, etc).
          # Force development so typecheck + tests have the toolchain they need.
          NODE_ENV: development
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag version     = v${TAG_VERSION}"
          echo "package version = ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Git tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Verify package contents (dry-run)
        run: npm pack --dry-run

      # ---- publish (staging tag only) ------------------------------------
      #
      # Authentication: OIDC trusted publishing (no NPM_TOKEN secret).
      # Configured on npmjs.com at:
      #   https://www.npmjs.com/package/@simba-dev/react-native-media-player/settings
      #   → Trusted Publisher → GitHub Actions
      #   → Organization/user: pavalep
      #   → Repository: react-native-media-player
      #   → Workflow filename: release.yml
      #   → Environment name: (blank)
      #
      # The trusted publisher is configured for "Staged publishing only"
      # (the secure recommended setting), so we publish with --tag=staging.
      # The version lands in npm under the "staging" tag. Consumers get it via:
      #   npm install @simba-dev/react-native-media-player@staging
      #
      # To promote staging → latest (production), trigger the
      # .github/workflows/promote.yml workflow from the Actions tab.
      #
      # `--provenance` is intentionally OMITTED — provenance attestation is
      # generated automatically by npm when publishing via trusted publishing
      # (see https://docs.npmjs.com/trusted-publishers#automatic-provenance-generation).
      # `--access public` is intentionally OMITTED — publishConfig.access=public
      # in package.json already configures this.
      - name: Publish to npm (staging tag)
        run: npm publish --tag=staging

      # ---- github release (draft, awaiting promote) ----------------------
      # Mark the release as a draft so consumers don't see "Latest"
      # pointing at it until promotion. Drafts can be edited/published
      # from the GitHub UI after the promote workflow runs.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
