name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        env:
          # GitHub-hosted runners default NODE_ENV=production, which makes
          # `npm ci` skip devDependencies (jest, typescript, @types/*, etc).
          # Force development so typecheck + tests have the toolchain they need.
          NODE_ENV: development
          # The postinstall hook (scripts/download-native.js) resolves the
          # release tag from package.json's version and fetches
          # releases/download/<tag>/jniLibs.tar.gz. That is a chicken-and-egg:
          # the release asset is created BY the tag push, so a CI run for the
          # commit that bumps the version can only ever look for a release
          # that does not exist yet. Every version bump would go red at
          # "Install dependencies" no matter what the source says.
          #
          # These jobs run typecheck + unit tests and never link the .so
          # files, so the download is pure cost here. The escape hatch is the
          # one the script itself documents for exactly this case.
          SKIP_DOWNLOAD_NATIVE: '1'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --reporters=default

      - name: Test (coverage)
        if: matrix.node == 20
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == 20 && hashFiles('./coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          retention-days: 14
