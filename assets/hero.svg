<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Simba Player — Android video player UI mockup. Shows a phone-shaped frame with title and artist, a large golden play button in the center flanked by skip-back and skip-forward controls, a progress scrubber at the bottom, and time labels 1:34 / 3:45.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#15152a"/>
      <stop offset="100%" stop-color="#0c0c1f"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0e0e1a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181828"/>
      <stop offset="100%" stop-color="#070710"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffd700" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- Top-left Simba Player branding -->
  <g transform="translate(80, 80)">
    <rect x="0" y="-2" width="36" height="36" rx="9" fill="#ffd700"/>
    <text x="50" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#fff" letter-spacing="4">SIMBA PLAYER</text>
    <text x="50" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#888" letter-spacing="1.5">Android video &amp; audio · libmpv engine</text>
  </g>

  <!-- Bottom-right version + npm tag -->
  <g transform="translate(1520, 820)">
    <text text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#666" letter-spacing="1">v12.0.2 · @simba-dev/react-native-media-player · MIT</text>
  </g>

  <!-- Feature chips top-right -->
  <g transform="translate(1520, 80)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(0, 0)">
      <rect x="-140" y="0" width="140" height="34" rx="17" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-opacity="0.4"/>
      <text x="-70" y="22" text-anchor="middle" fill="#ffd700">PiP</text>
    </g>
    <g transform="translate(0, 44)">
      <rect x="-160" y="0" width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="-80" y="22" text-anchor="middle" fill="#ddd">MediaSession</text>
    </g>
    <g transform="translate(0, 88)">
      <rect x="-150" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="-75" y="22" text-anchor="middle" fill="#ddd">Foreground svc</text>
    </g>
    <g transform="translate(0, 132)">
      <rect x="-130" y="0" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="-65" y="22" text-anchor="middle" fill="#ddd">TypeScript</text>
    </g>
  </g>

  <!-- Phone frame (centered): 800x600 starting at (400, 150) -->
  <g transform="translate(400, 150)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="800" height="600" rx="48" ry="48" fill="url(#frame)" stroke="#2a2a3e" stroke-width="2"/>
    <!-- Inner screen -->
    <rect x="20" y="20" width="760" height="560" rx="32" ry="32" fill="url(#screen)"/>
    <!-- Notch -->
    <rect x="345" y="20" width="110" height="22" rx="11" fill="#000"/>

    <!-- Top status bar -->
    <text x="55" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#aaa" font-weight="500">9:41</text>
    <g transform="translate(680, 60)">
      <!-- signal -->
      <rect x="0" y="6" width="3" height="6" rx="0.5" fill="#aaa"/>
      <rect x="6" y="3" width="3" height="9" rx="0.5" fill="#aaa"/>
      <rect x="12" y="0" width="3" height="12" rx="0.5" fill="#aaa"/>
      <!-- wifi -->
      <path d="M 22 8 Q 28 2, 34 8" fill="none" stroke="#aaa" stroke-width="1.5"/>
      <path d="M 24 10 Q 28 7, 32 10" fill="none" stroke="#aaa" stroke-width="1.5"/>
      <circle cx="28" cy="12" r="1" fill="#aaa"/>
      <!-- battery -->
      <rect x="42" y="2" width="22" height="10" rx="2" fill="none" stroke="#aaa" stroke-width="1"/>
      <rect x="44" y="4" width="16" height="6" rx="1" fill="#aaa"/>
      <rect x="65" y="5" width="2" height="4" rx="0.5" fill="#aaa"/>
    </g>

    <!-- Title block -->
    <text x="55" y="190" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#fff">Big Buck Bunny</text>
    <text x="55" y="222" font-family="system-ui, sans-serif" font-size="16" fill="#bbb" font-weight="400">Blender Foundation · Sintel channel · 2008</text>

    <!-- Subtle gradient overlay behind controls -->
    <rect x="40" y="240" width="720" height="180" rx="20" fill="#ffffff" fill-opacity="0.02"/>

    <!-- Glow behind play button -->
    <circle cx="400" cy="335" r="120" fill="url(#glow)"/>

    <!-- Skip-back button -->
    <g transform="translate(220, 335)">
      <circle cx="0" cy="0" r="36" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <polygon points="-9,-12 9,0 -9,12" fill="#fff"/>
      <rect x="-15" y="-13" width="3" height="26" rx="0.5" fill="#fff"/>
    </g>

    <!-- Big play button -->
    <g transform="translate(400, 335)">
      <circle cx="0" cy="0" r="58" fill="#ffd700"/>
      <circle cx="0" cy="0" r="58" fill="none" stroke="#ffd700" stroke-opacity="0.4" stroke-width="3"/>
      <polygon points="-19,-23 23,0 -19,23" fill="#0c0c14"/>
    </g>

    <!-- Skip-forward button -->
    <g transform="translate(580, 335)">
      <circle cx="0" cy="0" r="36" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <polygon points="9,-12 -9,0 9,12" fill="#fff"/>
      <rect x="12" y="-13" width="3" height="26" rx="0.5" fill="#fff"/>
    </g>

    <!-- Scrubber / progress bar -->
    <g transform="translate(55, 460)">
      <rect x="0" y="0" width="690" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="0" y="0" width="245" height="6" rx="3" fill="#ffd700"/>
      <circle cx="245" cy="3" r="9" fill="#ffd700" stroke="#0c0c14" stroke-width="2"/>
    </g>

    <!-- Time labels -->
    <text x="55" y="500" font-family="system-ui, sans-serif" font-size="14" fill="#bbb" font-weight="500">1:34</text>
    <text x="745" y="500" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#888" font-weight="500">3:45</text>

    <!-- Bottom icon row -->
    <g transform="translate(55, 540)" font-family="system-ui, sans-serif" font-size="11" fill="#fff" font-weight="600">
      <!-- Subtitles -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="58" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/>
        <text x="29" y="17" text-anchor="middle">CC</text>
      </g>
      <!-- PiP -->
      <g transform="translate(72, 0)">
        <rect x="0" y="0" width="58" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/>
        <rect x="14" y="7" width="22" height="14" rx="2" fill="none" stroke="#fff" stroke-width="1.3"/>
        <rect x="38" y="16" width="6" height="6" fill="#fff"/>
      </g>
      <!-- AirPlay-like -->
      <g transform="translate(144, 0)">
        <rect x="0" y="0" width="58" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/>
        <polygon points="14,12 44,12 38,18 20,18" fill="none" stroke="#fff" stroke-width="1.3"/>
        <path d="M 18 8 Q 29 0, 40 8" fill="none" stroke="#fff" stroke-width="1.3"/>
      </g>
      <!-- HD pill -->
      <g transform="translate(620, 0)">
        <rect x="0" y="0" width="58" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/>
        <text x="29" y="17" text-anchor="middle">HD</text>
      </g>
    </g>
  </g>
</svg>
