name: Release (publish to npm + create GitHub Release)

# Auto-triggers on `v*.*.*` tag push. Also accepts manual
# `workflow_dispatch` for re-runs (e.g. retry a release after a
# transient registry issue).
#
# The `production` GitHub Environment binding on the job is what
# makes NPM_TOKEN readable — the secret is set at environment scope,
# not repo scope. The Debug NPM_TOKEN presence step verifies the
# secret is reachable BEFORE the publish step so a missing token
# fails fast with a clear message instead of an opaque npm 401.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. "1.5.10" or "v1.5.10"). Must match the version in package.json on main.'
        required: true
        type: string
      npm_dist_tag:
        description: 'npm dist-tag to apply (default: latest). Use "next" or "beta" for pre-releases.'
        required: false
        default: 'latest'
        type: string

# Authentication: `secrets.NPM_TOKEN` (Automation scope, configured at
# Settings → Secrets and variables → Actions on this repo). Token must
# have publish rights on the @simba-dev org scope.
#
# `contents: write` is needed so the workflow can create the git tag
# (if missing) and the GitHub Release step can publish the release.
permissions:
  contents: write

concurrency:
  # Single in-flight release at a time (manual runs are rare; safety
  # against accidental double-clicks in the GitHub UI).
  group: release-manual
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Provenance pins for upstream mpv-android prebuilts.
#
# MPV_NATIVE_PROVENANCE.md (in android/src/main/jniLibs/) is the
# canonical source. This workflow pins the exact tag + asset set
# referenced there so a future mpv-android release doesn't silently
# change the binaries consumers receive. When bumping mpv-android,
# update both MPV_NATIVE_PROVENANCE.md AND the values below in the
# same commit.
# ---------------------------------------------------------------------------
env:
  MPV_ANDROID_TAG: '2026-08-11'
  MPV_ANDROID_RELEASE_BASE: 'https://github.com/mpv-android/mpv-android/releases/download'
  # ABIs we ship jniLibs/ for. Must match the consumer's CMakeLists.txt
  # probe + the REQUIRED_ABIS list in scripts/download-native.js.
  TARGET_ABIS: 'arm64-v8a armeabi-v7a x86 x86_64'

jobs:
  # -------------------------------------------------------------------------
  # build-native-libs
  #
  # Builds the lib's jniLibs/ directory end-to-end from upstream sources
  # so the tarball uploaded to GitHub Releases is reproducible by CI
  # without ever needing to commit binaries to git history.
  #
  # Pipeline:
  #   1. Download the per-ABI release APKs from mpv-android @ MPV_ANDROID_TAG
  #      (these APKs bundle the upstream libmpv, libav*, libc++_shared, etc.)
  #   2. Extract lib/<abi>/*.so from each APK into android/src/main/jniLibs/<abi>/
  #   3. Build libsimbaplayer_mpv.so (our JNI wrapper) via CMake + NDK for
  #      each ABI, linking against the freshly-extracted libmpv.so. Replace
  #      the upstream libplayer.so with our built libsimbaplayer_mpv.so.
  #   4. Tar + SHA-256 the assembled jniLibs/ tree.
  #   5. Upload as a workflow artifact so the `release` job can attach
  #      it to the GitHub Release.
  #
  # Why this job exists (vs committing binaries to git): ~150 MB of .so
  # files would bloat every clone forever. The llama.rn pattern (postinstall
  # download from GitHub Releases) is the industry-standard distribution
  # model for RN libs shipping prebuilt natives — see
  # https://github.com/mybigday/llama.rn and the discussion in the v1.5.14
  # commit message (this release's commit).
  # -------------------------------------------------------------------------
  build-native-libs:
    name: Build native libs (jniLibs/)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (NDK + cmake for native build)
        uses: android-actions/setup-android@v4
        with:
          # NDK r27.1.12297006 + cmake 3.22.1 matches the consumer's
          # build environment (verified on MOBILE_APP_REACT_NATIVE V22).
          # platforms;android-24 is the minSdk we target.
          packages: 'ndk;27.1.12297006 cmake;3.22.1 platforms;android-24 build-tools;34.0.0'
          accept-sdk-licenses: true

      - name: Download mpv-android per-ABI release APKs
        env:
          RELEASE_BASE: ${{ env.MPV_ANDROID_RELEASE_BASE }}
          TAG: ${{ env.MPV_ANDROID_TAG }}
          ABIS: ${{ env.TARGET_ABIS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _prebuilts
          for ABI in $ABIS; do
            URL="${RELEASE_BASE}/${TAG}/app-default-${ABI}-release.apk"
            echo "Downloading $URL"
            curl -fsSL --retry 3 --retry-delay 5 -o "_prebuilts/${ABI}.apk" "$URL"
            # Sanity: APK must be a valid ZIP (starts with PK\x03\x04)
            head -c 4 "_prebuilts/${ABI}.apk" | xxd | head -1
          done
          echo "All APKs downloaded:"
          ls -lh _prebuilts/

      - name: Extract upstream .so files from each APK into android/src/main/jniLibs/
        env:
          ABIS: ${{ env.TARGET_ABIS }}
        shell: bash
        run: |
          set -euo pipefail
          # Clean any prior jniLibs state (in case the runner has cached
          # state from a previous failed run) — the CMake build needs
          # libmpv.so to be present at configure time.
          rm -rf android/src/main/jniLibs
          for ABI in $ABIS; do
            mkdir -p "android/src/main/jniLibs/${ABI}"
            # APKs are ZIPs. The per-ABI APKs from mpv-android bundle their
            # native libs under lib/<abi>/ — extract all *.so files
            # flattened into our jniLibs/<abi>/ directory.
            unzip -o -j "_prebuilts/${ABI}.apk" "lib/${ABI}/*.so" -d "android/src/main/jniLibs/${ABI}/"
          done
          echo "Extracted jniLibs tree:"
          find android/src/main/jniLibs -maxdepth 2 -mindepth 1 | sort

      - name: Verify libmpv.so is present in each ABI (CMake configure-time requirement)
        env:
          ABIS: ${{ env.TARGET_ABIS }}
        shell: bash
        run: |
          set -euo pipefail
          for ABI in $ABIS; do
            if [ ! -f "android/src/main/jniLibs/${ABI}/libmpv.so" ]; then
              echo "::error::libmpv.so missing from android/src/main/jniLibs/${ABI}/ after APK extraction."
              echo "::error::Upstream mpv-android ${MPV_ANDROID_TAG} APK for ${ABI} does not contain libmpv.so — this is unexpected."
              exit 1
            fi
            echo "OK: android/src/main/jniLibs/${ABI}/libmpv.so ($(stat -c%s "android/src/main/jniLibs/${ABI}/libmpv.so") bytes)"
          done

      - name: Build libsimbaplayer_mpv.so for each ABI via CMake + NDK
        env:
          # android-actions/setup-android@v3 sets ANDROID_HOME via
          # $GITHUB_ENV (no need to reference steps.<id>.outputs which
          # would be empty because the step lacks an explicit `id:`).
          # ANDROID_NDK_HOME is derived from ANDROID_HOME.
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          ABIS: ${{ env.TARGET_ABIS }}
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake"
          if [ ! -f "$TOOLCHAIN" ]; then
            echo "::error::Android NDK toolchain file not found at $TOOLCHAIN"
            echo "::error::ANDROID_HOME=$ANDROID_HOME ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            exit 1
          fi
          for ABI in $ABIS; do
            echo "=========================================="
            echo "Building libsimbaplayer_mpv.so for ${ABI}"
            echo "=========================================="
            rm -rf "_build/${ABI}"
            mkdir -p "_build/${ABI}"
            ( cd "_build/${ABI}" && cmake \
                -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
                -DANDROID_ABI="${ABI}" \
                -DANDROID_PLATFORM=android-24 \
                -DCMAKE_BUILD_TYPE=Release \
                -DANDROID_STL=c++_shared \
                -DCMAKE_CXX_FLAGS="-std=c++17 -fvisibility=hidden -fvisibility-inlines-hidden" \
                -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=TRUE \
                "../../android/src/main/cpp" )
            ( cd "_build/${ABI}" && cmake --build . --config Release -- -j"$(nproc)" )
            if [ ! -f "_build/${ABI}/libsimbaplayer_mpv.so" ]; then
              echo "::error::Build did not produce _build/${ABI}/libsimbaplayer_mpv.so"
              exit 1
            fi
            # Replace the upstream mpv-android libplayer.so (their JNI wrapper)
            # with our libsimbaplayer_mpv.so. Keep the name `libplayer.so` so
            # System.loadLibrary("simbaplayer_mpv") in MPVLib.java still finds it.
            cp "_build/${ABI}/libsimbaplayer_mpv.so" "android/src/main/jniLibs/${ABI}/libplayer.so"
            echo "Built + installed android/src/main/jniLibs/${ABI}/libplayer.so ($(stat -c%s "android/src/main/jniLibs/${ABI}/libplayer.so") bytes)"
          done

      - name: Verify libsimbaplayer_mpv.so is 16 KB page-size aligned (D-033)
        # D-033 (V16.0.8): Android 14+ 16 KB page-size requirement. Without
        # 16 KB-aligned LOAD segments, Android App Compatibility reports
        # "LOAD segment not aligned" for libsimbaplayer_mpv.so and refuses
        # to load it, cascading to "Unknown error" for libmpv.so, libc++_shared.so,
        # libav*.so (transitively loaded via NEEDED) — app boots to white screen.
        # The CMakeLists.txt emits -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384.
        # This step verifies the linker actually honored those flags by
        # checking the LOAD segments in the ELF program header table.
        env:
          ABIS: ${{ env.TARGET_ABIS }}
        shell: bash
        run: |
          set -euo pipefail
          for ABI in $ABIS; do
            SO="android/src/main/jniLibs/${ABI}/libplayer.so"
            # readelf is in the NDK prebuilt toolchain. Check that every
            # LOAD segment's Align field is >= 16384 (0x4000).
            READELF="${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/27.1.12297006}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
            if [ ! -x "$READELF" ]; then
              # Fall back to system readelf if NDK path doesn't exist
              READELF="$(command -v readelf || echo /usr/bin/readelf)"
            fi
            echo "Checking 16 KB alignment for ${ABI}/libplayer.so via $READELF"
            "$READELF" -l "$SO" 2>&1 | tee /tmp/readelf_${ABI}.out
            # Validate: every LOAD line should have Align 0x4000 or larger.
            # Some toolchains report 0x1000 for TLS-like segments; we only
            # care about the main LOAD segments, which must be 16 KB aligned.
            if grep -E '^\s*LOAD' /tmp/readelf_${ABI}.out | awk '{print $NF}' | sort -u | grep -vqE '^(0x)?(4000|10000|40000|100000)$'; then
              echo "::warning::${ABI}/libplayer.so has LOAD segments with non-16 KB-aligned Align values. See /tmp/readelf_${ABI}.out."
              # Don't fail the build — warn only — because some toolchains
              # report 0x1000 for non-critical segments and it's still
              # acceptable for Android 14+. The minSdk-24 devices don't
              # care about 16 KB alignment.
            else
              echo "OK: ${ABI} libplayer.so LOAD segments are 16 KB-aligned."
            fi
          done

      - name: Tar + SHA-256 the assembled jniLibs/
        shell: bash
        run: |
          set -euo pipefail
          # IMPORTANT: tar with the FULL relative path `android/src/main/jniLibs`
          # (not `-C android/src/main jniLibs`) so the archive's internal paths
          # are `android/src/main/jniLibs/<abi>/libmpv.so`. When the postinstall
          # script on the consumer side runs `tar -xzf jniLibs.tar.gz` from
          # `node_modules/@simba-dev/react-native-media-player/`, the files land
          # at `node_modules/.../android/src/main/jniLibs/<abi>/libmpv.so` —
          # the exact path the consumer's CMakeLists.txt probes for at
          # configure time (`cpp/../jniLibs/<abi>/libmpv.so`).
          #
          # If we'd used `tar -C android/src/main jniLibs` instead, internal
          # paths would be `jniLibs/<abi>/libmpv.so` and files would extract
          # to `node_modules/.../jniLibs/<abi>/libmpv.so` — one directory
          # short of where CMake looks, producing the
          # "libmpv.so not found at android/src/main/jniLibs/..."
          # error during the consumer's gradle build.
          tar -czf jniLibs.tar.gz android/src/main/jniLibs
          SHA=$(sha256sum jniLibs.tar.gz | awk '{print $1}')
          printf '%s  jniLibs.tar.gz\n' "$SHA" > jniLibs.tar.gz.sha256
          echo "jniLibs.tar.gz size: $(stat -c%s jniLibs.tar.gz) bytes"
          echo "jniLibs.tar.gz sha256: ${SHA}"
          # Sanity check that internal paths are correct. We use `>file` +
          # `head` instead of `tar -tzf | head -5` because the pipe causes
          # SIGPIPE on tar (head closes its stdin after 5 lines), which —
          # combined with `set -euo pipefail` — fails the step even though
          # the tarball itself is fine. The `|| true` below is belt-and-braces
          # against any other head/tar SIGPIPE-related quirk.
          tar -tzf jniLibs.tar.gz > /tmp/tarlist.txt
          echo "---first 5 internal paths (sanity check)---"
          head -5 /tmp/tarlist.txt || true
          rm -f /tmp/tarlist.txt
          cat jniLibs.tar.gz.sha256

      - name: Upload jniLibs.tar.gz as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs-${{ github.ref_name }}
          path: |
            jniLibs.tar.gz
            jniLibs.tar.gz.sha256
          # Short retention — the release job consumes it immediately.
          retention-days: 1

  # -------------------------------------------------------------------------
  # release
  #
  # Publishes to npm + creates GitHub Release (with the built jniLibs/
  # attached). Depends on build-native-libs so the tarball is ready
  # before we attempt to attach it to the release.
  # -------------------------------------------------------------------------
  release:
    name: Publish to npm + create GitHub Release
    runs-on: ubuntu-latest
    needs: build-native-libs
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.npmjs.com/package/@simba-dev/react-native-media-player

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog/release-notes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        env:
          # SKIP_DOWNLOAD_NATIVE: bypass the postinstall hook that downloads
          # jniLibs from GitHub Releases. This CI flow builds the binaries
          # itself (build-native-libs job) and doesn't need the postinstall
          # hook to fetch them — running it here would be a chicken-and-egg
          # (v1.5.14 release doesn't exist yet at the time of `npm ci`).
          # The downloaded jniLibs artifact (downloaded in the next step)
          # is what gets attached to the GitHub Release instead.
          SKIP_DOWNLOAD_NATIVE: '1'
          NODE_ENV: development
        # --ignore-scripts is belt-and-braces: even if SKIP_DOWNLOAD_NATIVE
        # is unset, the lib's postinstall would still try to fetch the
        # not-yet-published release and fail. Combined with the env var,
        # this is double-safe.
        run: npm ci --ignore-scripts

      - name: Download jniLibs artifact
        uses: actions/download-artifact@v4
        with:
          name: jniLibs-${{ github.ref_name }}
          path: ./_artifacts/

      - name: Resolve and verify release version
        id: resolve
        shell: bash
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -z "$INPUT_VERSION" ]; then
            INPUT_VERSION="${GITHUB_REF_NAME}"
          fi
          INPUT_VERSION="${INPUT_VERSION#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "input version   = v${INPUT_VERSION}"
          echo "package version = ${PKG_VERSION}"
          if [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Input version v${INPUT_VERSION} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi
          echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${INPUT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # Kotlin compile gate via the lib's `example/` app — verifies the
      # lib's Kotlin sources compile in a realistic environment (real AGP,
      # real RN gradle plugin, real codegen). Same pattern used by
      # react-native-screens, react-native-network-client, etc.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (full install for codegen)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-sdk-licenses: true

      - name: Install example app dependencies
        env:
          # The example app depends on the lib via file:.. which copies
          # the lib source into example/node_modules and runs the lib's
          # postinstall hook. Bypass for the same reason as the lib's
          # own npm ci above: v1.5.14 GitHub Release doesn't exist yet.
          SKIP_DOWNLOAD_NATIVE: '1'
        run: |
          cd example
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Kotlin compile gate (via example app)
        env:
          # android-actions/setup-android@v3 sets ANDROID_HOME via
          # $GITHUB_ENV (the steps.<id>.outputs.android-home reference
          # would be empty because the step has no explicit `id:`, so
          # use the env var the action exports directly).
          JAVA_OPTS: '-XX:MaxHeapSize=4g'
        run: |
          cd example/android
          bash gradlew :simba-dev_react-native-media-player:compileDebugKotlin --no-daemon --console=plain 2>&1 | tail -80
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::Kotlin compile gate failed. The lib's Kotlin sources did not compile in a realistic environment. See log above for the exact error."
            exit 1
          fi

      - name: Verify package contents (dry-run)
        run: npm pack --dry-run

      - name: Debug NPM_TOKEN presence
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is unset or empty."
            exit 1
          fi
          TOKEN_LEN=${#NPM_TOKEN}
          TOKEN_HEAD="${NPM_TOKEN:0:4}"
          TOKEN_TAIL="${NPM_TOKEN: -4}"
          echo "NPM_TOKEN is set: length=$TOKEN_LEN head=$TOKEN_HEAD tail=$TOKEN_TAIL"
          if [ "$TOKEN_LEN" -lt 36 ] || [ "$TOKEN_LEN" -gt 60 ]; then
            echo "::warning::NPM_TOKEN length $TOKEN_LEN is outside the expected 36-60 range."
          fi

      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          DIST_TAG="${{ inputs.npm_dist_tag }}"
          DIST_TAG="${DIST_TAG:-latest}"
          if npm view "@simba-dev/react-native-media-player@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::Version ${VERSION} is already published to npm. Skipping publish step."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            npm publish --tag="${DIST_TAG}"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure release tag exists
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally. Skipping create."
          else
            echo "Creating tag $TAG at current HEAD on main..."
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # Create GitHub Release + attach the built jniLibs.tar.gz (and its
      # .sha256 companion) as release assets. This is what the consumer's
      # postinstall hook downloads from during `npm install`.
      #
      # Idempotency: if the release already exists (e.g. a manual
      # `gh release create` was run earlier), the action fails with
      # "already_exists". We handle this by checking first and either
      # creating fresh OR uploading assets to the existing release.
      - name: Create GitHub Release + attach jniLibs assets
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          PRERELEASE_FLAG: ${{ inputs.npm_dist_tag != '' && inputs.npm_dist_tag != 'latest' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ART_DIR="_artifacts"
          # actions/download-artifact@v4 may or may not create a subdirectory
          # depending on whether there's a conflict (v3 always created one,
          # v4 is smarter). Locate the tarball + sha by name to handle both.
          TARBALL=$(find "$ART_DIR" -name "jniLibs.tar.gz" -type f | head -1)
          SHA=$(find "$ART_DIR" -name "jniLibs.tar.gz.sha256" -type f | head -1)
          if [ -z "$TARBALL" ] || [ -z "$SHA" ]; then
            echo "::error::Could not locate jniLibs.tar.gz / jniLibs.tar.gz.sha256 under $ART_DIR"
            echo "::error::Artifact directory contents:"
            ls -lR "$ART_DIR" || true
            exit 1
          fi
          echo "Will attach: $TARBALL ($(stat -c%s "$TARBALL") bytes) + $SHA"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading assets only."
            gh release upload "$TAG" "$TARBALL" "$SHA" --clobber
          else
            echo "Creating release $TAG with assets."
            ARGS=(
              "$TAG"
              --title "$TAG"
              --generate-notes
              --draft=false
            )
            if [ "$PRERELEASE_FLAG" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            ARGS+=("$TARBALL" "$SHA")
            gh release create "${ARGS[@]}"
          fi
          echo "Release assets:"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) (\(.size) bytes)"'
